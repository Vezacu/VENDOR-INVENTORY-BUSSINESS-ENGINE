name: Clean expired checkout reservations

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Release expired reservations
        env:
          VERCEL_APP_URL: ${{ vars.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$VERCEL_APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the VERCEL_APP_URL repository variable and CRON_SECRET repository secret."
            exit 1
          fi
          case "$VERCEL_APP_URL" in
            https://*) ;;
            *)
              echo "::error::VERCEL_APP_URL must use https://."
              exit 1
              ;;
          esac
          curl --fail --silent --show-error --max-time 45 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${VERCEL_APP_URL%/}/api/cron/cleanup-expired-reservations"
